<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Only Jump Twice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        /* ===== 游戏容器（16:9自适应居中） ===== */
        #game-wrapper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #unity-container {
            position: relative;
            background: #000;
        }
        #unity-canvas {
            display: block;
            background: #000;
        }

        /* ===== 自定义加载界面（黑白极简） ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-title {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }
        .loading-subtitle {
            color: #666;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: #222;
            position: relative;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }
        .loading-percent {
            color: #888;
            font-size: 13px;
            margin-top: 16px;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 警告横幅（Unity内部使用，隐藏显示） ===== */
        #unity-warning {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 游戏容器 -->
    <div id="game-wrapper">
        <div id="unity-container">
            <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        </div>
    </div>

    <!-- 自定义加载界面 -->
    <div id="loading-screen">
        <div class="loading-title">Only Jump Twice</div>
        <div class="loading-subtitle">LOADING</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-percent" id="loading-percent">0%</div>
    </div>

    <!-- Unity警告横幅（隐藏） -->
    <div id="unity-warning"> </div>

    <script>
        // ===== Unity构建配置（模板占位符将在构建时被替换） =====
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/WebGL.data.unityweb",
            frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
            codeUrl: buildUrl + "/WebGL.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "final work",
            productVersion: "1.0",
        };

        // ===== DOM引用 =====
        var canvas = document.querySelector("#unity-canvas");
        var container = document.querySelector("#unity-container");
        var gameWrapper = document.getElementById("game-wrapper");
        var loadingScreen = document.getElementById("loading-screen");
        var loadingBarFill = document.getElementById("loading-bar-fill");
        var loadingPercent = document.getElementById("loading-percent");

        // ===== 移动端检测（User-Agent + 触摸 + 屏幕尺寸） =====
        var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
            || ('ontouchstart' in window && window.innerWidth < 1024);

        // 当前是否处于强制旋转状态
        var isRotated = false;

        if (isMobileDevice) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        // ===== 移动端强制横屏显示 =====
        // 当移动端竖屏时，用CSS transform将游戏容器旋转90度，
        // 无需用户手动旋转设备。PC端不受影响。
        function forceLandscape() {
            if (!isMobileDevice) {
                // PC端：正常显示，不旋转
                isRotated = false;
                resetElementTransform(gameWrapper);
                resetElementTransform(loadingScreen);
                resizeGameCanvas();
                return;
            }

            if (window.innerHeight > window.innerWidth) {
                // ===== 竖屏：强制旋转90度 =====
                isRotated = true;
                // 旋转后：容器宽度 = 视口高度，容器高度 = 视口宽度
                var rotatedW = window.innerHeight;
                var rotatedH = window.innerWidth;

                applyRotation(gameWrapper, rotatedW, rotatedH);
                applyRotation(loadingScreen, rotatedW, rotatedH);
            } else {
                // ===== 横屏：正常显示 =====
                isRotated = false;
                resetElementTransform(gameWrapper);
                resetElementTransform(loadingScreen);
            }

            resizeGameCanvas();
        }

        // 对指定元素应用90度旋转并居中
        function applyRotation(el, w, h) {
            el.style.transform = 'rotate(90deg)';
            el.style.transformOrigin = 'center center';
            el.style.position = 'fixed';
            el.style.width = w + 'px';
            el.style.height = h + 'px';
            el.style.left = '50%';
            el.style.top = '50%';
            el.style.right = 'auto';
            el.style.bottom = 'auto';
            el.style.marginLeft = (-w / 2) + 'px';
            el.style.marginTop = (-h / 2) + 'px';
        }

        // 重置元素变换（恢复正常全屏显示）
        function resetElementTransform(el) {
            el.style.transform = 'none';
            el.style.transformOrigin = 'center center';
            el.style.position = 'fixed';
            el.style.width = '100%';
            el.style.height = '100%';
            el.style.left = '0';
            el.style.top = '0';
            el.style.right = '0';
            el.style.bottom = '0';
            el.style.marginLeft = '0';
            el.style.marginTop = '0';
        }

        // ===== 16:9 画布自适应 =====
        // 注意：当处于强制旋转状态时，有效视口宽高需要互换
        function resizeGameCanvas() {
            var gameRatio = 16 / 9;
            // 旋转后：视觉上的宽度 = 实际视口高度，视觉上的高度 = 实际视口宽度
            var winW = isRotated ? window.innerHeight : window.innerWidth;
            var winH = isRotated ? window.innerWidth : window.innerHeight;
            var winRatio = winW / winH;

            var displayW, displayH;
            if (winRatio > gameRatio) {
                displayH = winH;
                displayW = Math.round(winH * gameRatio);
            } else {
                displayW = winW;
                displayH = Math.round(winW / gameRatio);
            }

            canvas.style.width = displayW + "px";
            canvas.style.height = displayH + "px";
            container.style.width = displayW + "px";
            container.style.height = displayH + "px";
        }

        // ===== 事件监听 =====
        window.addEventListener('resize', function() {
            forceLandscape();
        });
        window.addEventListener('orientationchange', function() {
            setTimeout(forceLandscape, 100);
        });

        // 初始化：强制横屏 + 画布自适应
        forceLandscape();

        // ===== 加载进度更新 =====
        function updateLoadingProgress(progress) {
            var percent = Math.round(progress * 100);
            loadingBarFill.style.width = percent + "%";
            loadingPercent.textContent = percent + "%";
        }

        function hideLoadingScreen() {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        // ===== 加载 Unity 实例 =====
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                updateLoadingProgress(progress);
            }).then(function(unityInstance) {
                hideLoadingScreen();
            }).catch(function(message) {
                loadingPercent.textContent = "加载失败，请刷新";
                loadingPercent.style.color = "#f44";
                console.error(message);
                if (typeof message === 'string') {
                    alert(message);
                }
            });
        };
        script.onerror = function() {
            loadingPercent.textContent = "加载失败，请刷新页面";
            loadingPercent.style.color = "#f44";
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
