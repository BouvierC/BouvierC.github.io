<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Only Jump Twice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* ===== 全局重置 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        /* ===== 游戏容器（16:9自适应居中） ===== */
        #game-wrapper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        #unity-container {
            position: relative;
            background: #000;
        }
        #unity-canvas {
            display: block;
            background: #000;
        }

        /* ===== 自定义加载界面（黑白极简） ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-title {
            color: #fff;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 6px;
            margin-bottom: 50px;
            text-transform: uppercase;
        }
        .loading-subtitle {
            color: #666;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 40px;
        }
        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: #222;
            position: relative;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
        }
        .loading-percent {
            color: #888;
            font-size: 13px;
            margin-top: 16px;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 横屏旋转提示遮罩（移动端竖屏时显示） ===== */
        #rotate-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #rotate-overlay.active {
            display: flex;
        }
        .rotate-icon {
            font-size: 72px;
            color: #fff;
            margin-bottom: 28px;
            animation: rotateHint 2s ease-in-out infinite;
        }
        @keyframes rotateHint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }
        .rotate-text {
            color: #fff;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
        }
        .rotate-subtext {
            color: #666;
            font-size: 13px;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* ===== 警告横幅（Unity内部使用，隐藏显示） ===== */
        #unity-warning {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 横屏旋转提示遮罩 -->
    <div id="rotate-overlay">
        <div class="rotate-icon">&#8635;</div>
        <div class="rotate-text">请旋转设备横屏游玩</div>
        <div class="rotate-subtext">ROTATE YOUR DEVICE TO PLAY</div>
    </div>

    <!-- 游戏容器 -->
    <div id="game-wrapper">
        <div id="unity-container">
            <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        </div>
    </div>

    <!-- 自定义加载界面 -->
    <div id="loading-screen">
        <div class="loading-title">Only Jump Twice</div>
        <div class="loading-subtitle">LOADING</div>
        <div class="loading-bar-container">
            <div class="loading-bar-fill" id="loading-bar-fill"></div>
        </div>
        <div class="loading-percent" id="loading-percent">0%</div>
    </div>

    <!-- Unity警告横幅（隐藏） -->
    <div id="unity-warning"> </div>

    <script>
        // ===== Unity构建配置（模板占位符将在构建时被替换） =====
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/WebGL.loader.js";
        var config = {
            dataUrl: buildUrl + "/WebGL.data.unityweb",
            frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
            codeUrl: buildUrl + "/WebGL.wasm.unityweb",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "final work",
            productVersion: "1.0",
        };

        // ===== DOM引用 =====
        var canvas = document.querySelector("#unity-canvas");
        var container = document.querySelector("#unity-container");
        var loadingScreen = document.getElementById("loading-screen");
        var loadingBarFill = document.getElementById("loading-bar-fill");
        var loadingPercent = document.getElementById("loading-percent");
        var rotateOverlay = document.getElementById("rotate-overlay");

        // ===== 移动端检测 =====
        var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (isMobileDevice) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        // ===== 16:9 画布自适应 =====
        function resizeGameCanvas() {
            var gameRatio = 16 / 9;
            var winW = window.innerWidth;
            var winH = window.innerHeight;
            var winRatio = winW / winH;

            var displayW, displayH;
            if (winRatio > gameRatio) {
                displayH = winH;
                displayW = Math.round(winH * gameRatio);
            } else {
                displayW = winW;
                displayH = Math.round(winW / gameRatio);
            }

            canvas.style.width = displayW + "px";
            canvas.style.height = displayH + "px";
            container.style.width = displayW + "px";
            container.style.height = displayH + "px";
        }

        window.addEventListener('resize', resizeGameCanvas);
        window.addEventListener('orientationchange', function() {
            setTimeout(resizeGameCanvas, 100);
        });
        resizeGameCanvas();

        // ===== 横屏检测（仅移动端） =====
        function checkOrientation() {
            if (isMobileDevice && window.innerHeight > window.innerWidth) {
                rotateOverlay.classList.add('active');
            } else {
                rotateOverlay.classList.remove('active');
                resizeGameCanvas();
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', function() {
            setTimeout(checkOrientation, 100);
        });
        checkOrientation();

        // ===== 加载进度更新 =====
        function updateLoadingProgress(progress) {
            var percent = Math.round(progress * 100);
            loadingBarFill.style.width = percent + "%";
            loadingPercent.textContent = percent + "%";
        }

        function hideLoadingScreen() {
            loadingScreen.classList.add('hidden');
            setTimeout(function() {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        // ===== 加载 Unity 实例 =====
        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
            createUnityInstance(canvas, config, function(progress) {
                updateLoadingProgress(progress);
            }).then(function(unityInstance) {
                hideLoadingScreen();
            }).catch(function(message) {
                loadingPercent.textContent = "加载失败，请刷新";
                loadingPercent.style.color = "#f44";
                console.error(message);
                if (typeof message === 'string') {
                    alert(message);
                }
            });
        };
        script.onerror = function() {
            loadingPercent.textContent = "加载失败，请刷新页面";
            loadingPercent.style.color = "#f44";
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
